# Foundry config. Matches the settings build/ was compiled with (solc 0.8.24, OpenZeppelin 5.1.0, optimizer 200
# runs, EVM cancun, viaIR — VirtueAuditRegistry.recordTrade needs viaIR). Sources sit at the repo root.
[profile.default]
src = "."
test = "test"
script = "script"
out = "out"
cache_path = "cache"
libs = ["lib", "node_modules"]
solc_version = "0.8.24"
auto_detect_solc = false
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
